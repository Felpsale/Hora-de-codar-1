<!--3.2. Leia dois valores. Enquanto o segundo valor for menor ou igual a zero, peça novamente esse mesmo valor. 
Ao final, mostre a divisão do primeiro pelo segundo..-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio3.2</title>
</head>
<body>
<script>
let numero1 = prompt("digite um número");
let numero2 = prompt("digite outro número");
try{
numero1 = Number(numero1)
numero2 = Number(numero2);
  if (isNaN(numero1) || isNaN(numero2))
  {
throw new Error("digite números válidos.");
}


while(numero2 <= 0) {
    numero2 = prompt("digite o número novamente");
}
alert("A divisão de " + numero1 + " por " + numero2 + " é: " + (numero1 / numero2));
}
catch (error) {
    alert(error.message);
}
</script>
    
</body>
</html>
