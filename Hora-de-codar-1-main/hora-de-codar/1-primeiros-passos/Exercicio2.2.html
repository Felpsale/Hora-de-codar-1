<body>
<script>
var numero1 = prompt("digite um número");
try {
        numero1 = Number(numero1);

if (isNaN(numero1)){
throw new Error("digite números válidos.");
}

if (numero1 > 0 ){

    alert ("Seu número é positivo")
}
else if(numero1 == 0){
    alert ("Seu número é zero")

} 
else if (numero1 < 0){
     alert ("seu número é negativo")
}
}
catch (erro) {
        alert("Valor inválido: Por favor, digite apenas números.");
        console.log(erro.message); 
    }

</script>
